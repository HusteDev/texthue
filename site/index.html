<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TextHue palette inspector</title>
<style>
:root{font:1rem/1.55 "Source Sans 3",system-ui,sans-serif;color:#172a32;background:#f7f6f2}main{max-width:66rem;margin:auto;padding:2rem 1rem}h1,h2{line-height:1.15}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:1rem}label{display:grid;align-content:start;gap:.3rem}textarea,select,button{font:inherit;padding:.45rem}textarea{resize:vertical}td,th{padding:.55rem;text-align:left;border-bottom:1px solid #b7c0bd}table{border-collapse:collapse}section{overflow:auto}pre{white-space:pre-wrap}button{cursor:pointer}
</style><main><h1>TextHue palette inspector</h1>
<form><label>Labels, one per line<textarea id="labels" rows="5">research
design
engineering</textarea></label><label>Resolver options or exported configuration (JSON)<textarea id="options" rows="5">{}</textarea></label>
<label>Load configuration file<input id="config-file" type="file" accept=".json,application/json"></label>
<fieldset><legend>Preset</legend><label>Role defaults<select id="preset"><option>labels</option><option>controls</option><option>chart</option><option>subdued</option><option>mono</option></select></label>
<button type="button" id="apply-preset">Apply preset</button></fieldset>
<fieldset><legend>Brand palette</legend><label>Palette ID<input id="brand-id"></label>
<label>Light fill<input type="color" id="brand-light" value="#387eb5"></label><label>Dark fill<input type="color" id="brand-dark" value="#6ca8d6"></label>
<button type="button" id="save-entry">Add or update color</button> <button type="button" id="remove-entry">Remove color</button></fieldset>
<label>Theme<select id="theme"><option>light</option><option>dark</option></select></label>
<label>Vision profile<select id="vision"><option>normal</option><option>deutan</option><option>protan</option><option>tritan</option></select></label>
<label><span><input id="optimize-vision" type="checkbox"> Optimize new placements for normal vision and the selected profile</span></label>
<label><span><input id="markers" type="checkbox"> Show identity shapes</span></label>
<label>Minimum OKLab distance<input id="minimum-distance" type="number" min="0" step="any" value="0" required></label>
<label>Saved registry (optional JSON)<textarea id="registry"></textarea></label><label>Load registry file<input id="registry-file" type="file" accept=".json,application/json"></label><button type="submit">Inspect palette</button></form>
<p role="status">Loading palette inspector...</p><section id="results"></section></main><script type="module">
import('./app.mjs').catch(error => {
  document.querySelector('[role=status]').textContent = 'Palette inspector could not start: ' + error.message;
  document.querySelector('button[type=submit]').disabled = true;
});
</script></html>
