[package]
name = "texthue"
version = "0.1.0"
edition = "2021"
description = "Deterministic text-to-color assignments"
license-file = "LICENSE"
repository = "https://github.com/HusteDev/texthue"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm-bindgen = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "=0.2.130", optional = true }
sha2 = "=0.11.1"
unicode-normalization = "=0.1.24"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
criterion = { version = "=0.5.1", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "renderer"
harness = false
