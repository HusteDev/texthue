[package]
name = "texthue"
version = "0.1.0"
edition = "2021"
description = "Deterministic text-to-color assignments"
license-file = "LICENSE"
repository = "https://github.com/HusteDev/texthue"

[dependencies]
sha2 = "=0.10.9"
unicode-normalization = "=0.1.24"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
