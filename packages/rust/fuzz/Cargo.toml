[package]
name = "texthue-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
texthue = { path = ".." }

[[bin]]
name = "options"
path = "fuzz_targets/options.rs"
test = false
doc = false
bench = false
