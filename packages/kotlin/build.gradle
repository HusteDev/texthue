plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'maven-publish'
    id 'io.gitlab.arturbosch.detekt' version '1.23.8'
}

group = 'com.hustedev'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}
// Preserve compatibility with the Kotlin 2.2 consumer used by the Maven packaging test.
kotlin.compilerOptions {
    languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
    apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
}
dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.21'
}

tasks.named('jar') {
    into('META-INF') { from files('LICENSE', 'THIRD_PARTY_NOTICES.md', 'SPECIFICATION.md') }
}
def apiDocs = tasks.register('apiDocsJar', Jar) {
    archiveClassifier = 'javadoc'
    from files('README.md', 'SPECIFICATION.md')
}
publishing {
    publications {
        library(MavenPublication) {
            from components.java
            artifact apiDocs
            pom {
                name = 'TextHue'
                description = 'Deterministic text-to-color assignments for Kotlin/JVM.'
                url = 'https://github.com/HusteDev/texthue'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'HusteDev'
                        name = 'TextHue contributors'
                        url = 'https://github.com/HusteDev/texthue/graphs/contributors'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/HusteDev/texthue.git'
                    developerConnection = 'scm:git:ssh://git@github.com/HusteDev/texthue.git'
                    url = 'https://github.com/HusteDev/texthue'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'staging'
            url = layout.buildDirectory.dir('repository')
        }
    }
}

def conformance = tasks.register('conformance', Exec) {
    dependsOn tasks.named('testClasses')
    doFirst {
        commandLine 'python', '../../tools/check-kotlin.py',
            '--java', new File(System.getProperty('java.home'), 'bin/java').absolutePath,
            '--classpath', sourceSets.test.runtimeClasspath.asPath
    }
}
tasks.named('check') { dependsOn conformance }
tasks.named('publishLibraryPublicationToStagingRepository') { dependsOn tasks.named('check') }

detekt {
    baseline = file('detekt-baseline.xml')
}

sourceSets {
    benchmark {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.benchmarkImplementation.extendsFrom configurations.implementation
tasks.register('benchmark', JavaExec) {
    dependsOn tasks.named('benchmarkClasses')
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'RendererBenchmarkKt'
}

sourceSets {
    jsonRunner {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.jsonRunnerImplementation.extendsFrom configurations.implementation
dependencies { jsonRunnerImplementation localGroovy() }
tasks.register('jsonConformance', JavaExec) {
    dependsOn tasks.named('jsonRunnerClasses')
    classpath = sourceSets.jsonRunner.runtimeClasspath
    mainClass = 'JsonRunnerKt'
    standardInput = System.in
}
