[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texthue"
version = "0.1.0"
description = "Deterministic text-to-color with matching JavaScript and Go results, OKLCH, themes, and contrast controls"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND W3C-20150513"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["color", "hash", "deterministic", "oklch", "contrast", "palette"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/HusteDev/texthue"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
texthue = ["py.typed", "_docs/*.md", "_docs/LICENSE"]
