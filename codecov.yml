coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

flags:
  javascript:
    paths:
      - packages/npm/src/
  python:
    paths:
      - packages/python/src/
  go:
    paths:
      - packages/go/

ignore:
  - "**/examples/**"
  - "**/dist/**"
  - "packages/go/cmd/**"
  - "tests/**"
  - "tools/**"

comment:
  layout: "condensed_header, diff, flags"
  require_changes: true
