# Lint and format checks for the TextHue workspace.
#
#   python -m pip install -r requirements-dev.txt
#   pre-commit install
#
# The JavaScript and TypeScript hooks use the repository's node_modules, so
# run `npm ci` first. The Go hook builds golangci-lint into an isolated Go
# environment on first use.
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
        exclude: ^(conformance/vectors\.json|packages/go/testdata/vectors\.json)$
      - id: trailing-whitespace
        exclude: ^(conformance/vectors\.json|packages/go/testdata/vectors\.json)$
        args: ["--markdown-linebreak-ext=md"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: ["--fix"]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.0
    hooks:
      - id: zizmor
        args: ["--min-severity=low", "--offline"]

  - repo: local
    hooks:
      - id: biome
        name: biome (JavaScript and TypeScript)
        entry: npx --no-install biome check --error-on-warnings --no-errors-on-unmatched
        language: system
        files: \.(js|mjs|cjs|ts|json)$
        exclude: ^(package-lock\.json|conformance/vectors\.json|packages/go/testdata/vectors\.json)$

      - id: tsc
        name: tsc (npm package)
        entry: npx --no-install tsc --noEmit -p packages/npm/tsconfig.json
        language: system
        files: ^packages/npm/(src/.*\.ts|tsconfig\.json)$
        pass_filenames: false

      - id: go-lint
        name: gofmt, go vet, golangci-lint
        entry: python tools/lint-go.py
        language: golang
        additional_dependencies:
          - github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
        files: ^packages/go/
        pass_filenames: false

      - id: shared-files
        name: shared specification, notice, and fixture copies
        entry: python tools/sync-shared.py --check
        language: system
        files: ^(LICENSE|SPECIFICATION\.md|THIRD_PARTY_NOTICES\.md|conformance/apca\-srgb\-v1\.json|conformance/assign\-vectors\.json|conformance/composite\-v1\.json|conformance/normalization\-v1\.json|conformance/p3\-contrast\-v1\.json|conformance/p3\-fit\-v1\.json|conformance/presets\-v1\.json|conformance/renderer\-v1\.json|conformance/tone\-repair\-v1\.tsv|conformance/vectors\.json|packages/csharp/LICENSE|packages/csharp/SPECIFICATION\.md|packages/csharp/THIRD_PARTY_NOTICES\.md|packages/dart/LICENSE|packages/dart/SPECIFICATION\.md|packages/dart/THIRD_PARTY_NOTICES\.md|packages/go/LICENSE|packages/go/SPECIFICATION\.md|packages/go/THIRD_PARTY_NOTICES\.md|packages/go/testdata/vectors\.json|packages/kotlin/LICENSE|packages/kotlin/SPECIFICATION\.md|packages/kotlin/THIRD_PARTY_NOTICES\.md|packages/npm/LICENSE|packages/npm/SPECIFICATION\.md|packages/npm/THIRD_PARTY_NOTICES\.md|packages/python/LICENSE|packages/python/README\.md|packages/python/SPECIFICATION\.md|packages/python/THIRD_PARTY_NOTICES\.md|packages/python/src/texthue/_docs/LICENSE|packages/python/src/texthue/_docs/README\.md|packages/python/src/texthue/_docs/SPECIFICATION\.md|packages/python/src/texthue/_docs/THIRD_PARTY_NOTICES\.md|packages/react/LICENSE|packages/rust/LICENSE|packages/rust/SPECIFICATION\.md|packages/rust/THIRD_PARTY_NOTICES\.md|packages/rust/testdata/apca\-srgb\-v1\.json|packages/rust/testdata/assign\-vectors\.json|packages/rust/testdata/composite\-v1\.json|packages/rust/testdata/normalization\-v1\.json|packages/rust/testdata/p3\-contrast\-v1\.json|packages/rust/testdata/p3\-fit\-v1\.json|packages/rust/testdata/presets\-v1\.json|packages/rust/testdata/tone\-repair\-v1\.tsv|packages/rust/testdata/vectors\.json|packages/swift/LICENSE|packages/swift/SPECIFICATION\.md|packages/swift/THIRD_PARTY_NOTICES\.md|packages/swift/Tests/TextHueTests/Fixtures/apca\-srgb\-v1\.json|packages/swift/Tests/TextHueTests/Fixtures/assign\-vectors\.json|packages/swift/Tests/TextHueTests/Fixtures/composite\-v1\.json|packages/swift/Tests/TextHueTests/Fixtures/normalization\-v1\.json|packages/swift/Tests/TextHueTests/Fixtures/p3\-contrast\-v1\.json|packages/swift/Tests/TextHueTests/Fixtures/p3\-fit\-v1\.json|packages/swift/Tests/TextHueTests/Fixtures/presets\-v1\.json|packages/swift/Tests/TextHueTests/Fixtures/renderer\-v1\.json|packages/swift/Tests/TextHueTests/Fixtures/tone\-repair\-v1\.tsv|packages/swift/Tests/TextHueTests/Fixtures/vectors\.json|packages/tailwind/LICENSE|packages/wasm/LICENSE|packages/wasm/SPECIFICATION\.md|packages/wasm/THIRD_PARTY_NOTICES\.md|tools/packages\.json)$
        pass_filenames: false

      - id: package-versions
        name: package versions agree
        entry: python tools/check-version.py
        language: system
        files: ^(package\.json|packages/csharp/src/TextHue/TextHue\.csproj|packages/dart/pubspec\.yaml|packages/kotlin/build\.gradle|packages/npm/package\.json|packages/python/pyproject\.toml|packages/python/src/texthue/__init__\.py|packages/react/package\.json|packages/rust/Cargo\.toml|packages/tailwind/package\.json|packages/wasm/package\.json|tools/packages\.json)$
        pass_filenames: false
