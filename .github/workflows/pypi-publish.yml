name: Publish Python to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version staged by the Publish workflow from this commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/texthue/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify staged release assets against this commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python tools/release.py check-version "$VERSION"
          gh release download "v$VERSION" --dir artifacts
          python tools/release.py verify-bundle "$VERSION" "$GITHUB_SHA" artifacts
      - name: Check PyPI's current state for this version
        id: state
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          STATE=$(python tools/release.py pypi-state --package texthue --version "$VERSION" --dist artifacts)
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
      - name: Select the wheel and source distribution
        if: steps.state.outputs.state == 'absent'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir dist
          cp "artifacts/texthue-${VERSION}-py3-none-any.whl" "artifacts/texthue-${VERSION}.tar.gz" dist/
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.state.outputs.state == 'absent'
        with:
          print-hash: true
      - name: Already published with these exact bytes
        if: steps.state.outputs.state == 'matching'
        run: echo "PyPI already has this version with matching bytes; skipping."
