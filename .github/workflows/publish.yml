name: Publish

# Publishes a release of all three libraries from the selected branch commit.
# Start it manually from the Actions tab. Every target is opt-in and the build
# job verifies the tree and the version before any upload happens.
#
# Resumability: the build job uploads the verified archives and a
# release-manifest.json (commit, versions, algorithm identifier, archive
# digests) as assets on a draft GitHub release before any registry upload.
# Each publish-* job checks its own target's state (absent/matching/
# conflicting/lookup-failed; see tools/release.py) before publishing, so
# re-running this workflow with only the failed target(s) selected reuses
# the same tested bytes rather than rebuilding, skips a target that already
# matches, and refuses to overwrite a conflicting one. A lookup failure
# (registry unreachable) is never treated as "safe to publish".
#
# One-time setup:
#   * npm:  either an NPM_TOKEN repository secret (granular automation token
#           with publish rights) or npm trusted publishing configured for
#           this repository and the `npm` environment.
#   * PyPI: a trusted publisher on pypi.org pointing at this repository,
#           workflow `publish.yml`, and the `pypi` environment. No secret.
#   * Go:   nothing; the module is published by pushing its tag.
# Optionally require reviewers on the `npm` and `pypi` environments.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v. Must match every package manifest.
        required: true
        type: string
      dry_run:
        description: Stage or verify the draft bundle and skip all registry jobs and release promotion
        type: boolean
        default: false
      resume:
        description: Require the original release bundle and fail if it is missing
        type: boolean
        default: false
      npm:
        description: Publish the npm package
        type: boolean
        default: true
      maven:
        description: Leave blank to skip Maven, enter new for a first upload, or enter the original Central deployment UUID to resume
        type: string
        required: false
      dart:
        description: Publish the staged Dart archive to pub.dev
        type: boolean
        default: false
      nuget:
        description: Publish the staged .NET package to NuGet.org
        type: boolean
        default: false
      rust:
        description: Publish the staged Rust crate to crates.io
        type: boolean
        default: false
      wasm:
        description: Publish the staged WebAssembly npm package
        type: boolean
        default: false
      npm_adapters:
        description: Publish the staged React and Tailwind npm adapters
        type: boolean
        default: false
      pypi:
        description: Publish the Python distribution to PyPI
        type: boolean
        default: true
      go:
        description: Tag the Go module release
        type: boolean
        default: true
      github_release:
        description: Create (or promote the draft of) a GitHub release with the built archives
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  MODULE: github.com/HusteDev/texthue/packages/go

jobs:
  build:
    name: Verify, build, and stage a draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23'
          cache: false
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: Check that every manifest declares the requested version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        # The version is read into a variable on its own line, not embedded
        # in the echo/GITHUB_OUTPUT command, so a failing check-version.py
        # stops this step under `set -e` instead of writing an empty-but-
        # "successful" output that downstream jobs would then publish under.
        run: |
          set -euo pipefail
          VERSION=$(python tools/release.py check-version "$REQUESTED")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify the root release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python tools/release.py root-tag-state --version "$VERSION" --commit "$GITHUB_SHA"
      - name: Locate the durable release bundle
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RESUME: ${{ inputs.resume }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          count=$(jq --arg tag "v$VERSION" '[.[][] | select(.tag_name == $tag)] | length' releases.json)
          case "$count" in
            0)
              if [[ "$RESUME" == true ]]; then
                echo "::error::Original release bundle is missing"
                exit 1
              fi
              echo "state=absent" >> "$GITHUB_OUTPUT"
              ;;
            1)
              jq -e --arg tag "v$VERSION" --arg sha "$GITHUB_SHA" \
                '.[][] | select(.tag_name == $tag) | .target_commitish == $sha' releases.json
              gh release download "v$VERSION" --dir artifacts
              echo "state=existing" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac
      - if: steps.bundle.outputs.state == 'absent'
        run: python tools/verify.py
      - if: steps.bundle.outputs.state == 'absent'
        run: python tools/build-packages.py
      - name: Pack and verify React and Tailwind adapters
        if: steps.bundle.outputs.state == 'absent'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm pack ./packages/react ./packages/tailwind --pack-destination artifacts
          python tools/check-react-consumers.py --archives artifacts
          python tools/check-tailwind-consumer.py --archives artifacts
          (cd artifacts && sha256sum "texthue-react-${VERSION}.tgz" "texthue-tailwind-${VERSION}.tgz" >> SHA256SUMS)
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: steps.bundle.outputs.state == 'absent'
        with:
          dotnet-version: '9.0.x'
      - name: Build and verify the NuGet release archive
        if: steps.bundle.outputs.state == 'absent'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python tools/verify.py --port csharp
          dotnet pack packages/csharp/src/TextHue --configuration Release --no-build --output artifacts
          python tools/check-nuget.py artifacts
          (cd artifacts && sha256sum "TextHue.${VERSION}.nupkg" >> SHA256SUMS)
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        if: steps.bundle.outputs.state == 'absent'
        with:
          sdk: '3.12.2'
      - name: Verify Dart conformance and publication contents
        if: steps.bundle.outputs.state == 'absent'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: packages/dart
        run: |
          set -euo pipefail
          dart pub get --enforce-lockfile
          python ../../tools/verify.py --port dart
          archive="texthue-${VERSION}-dart.tar.gz"
          python ../../tools/check-dart-publication.py --stage "../../artifacts/$archive"
          (cd ../../artifacts && sha256sum "$archive" >> SHA256SUMS)
      - name: Stage the Kotlin Maven repository
        if: steps.bundle.outputs.state == 'absent'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          python tools/verify.py --port kotlin
          packages/kotlin/gradlew -p packages/kotlin publishLibraryPublicationToStagingRepository
          python tools/check-maven.py --stage artifacts
          (cd artifacts && sha256sum "texthue-${VERSION}-maven.zip" >> SHA256SUMS)
      - name: Stage the tested WebAssembly npm archive
        if: steps.bundle.outputs.state == 'absent'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          cargo install --locked --version 0.2.130 wasm-bindgen-cli
          npm pack ./packages/wasm --pack-destination artifacts
          archive="texthue-wasm-${VERSION}.tgz"
          python tools/check-wasm-consumer.py "artifacts/$archive"
          python tools/check-browser.py google-chrome --wasm-package "artifacts/$archive"
          (cd artifacts && sha256sum "$archive" >> SHA256SUMS)
      - name: Stage the tested Rust crate
        if: steps.bundle.outputs.state == 'absent'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python tools/stage-rust.py artifacts
          (cd artifacts && sha256sum "texthue-${VERSION}.crate" >> SHA256SUMS)
      - name: Write the release manifest (commit, versions, algorithm id, archive digests)
        if: steps.bundle.outputs.state == 'absent'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python tools/release.py manifest \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --algorithm-version text-to-color-v1 \
            --artifacts artifacts \
            --out artifacts/release-manifest.json
      - name: Verify bundle contents before distributing
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python tools/release.py verify-bundle "$VERSION" "$GITHUB_SHA" artifacts
      - name: Stage original tested bytes
        if: steps.bundle.outputs.state == 'absent'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" artifacts/* --target "$GITHUB_SHA" --title "TextHue $VERSION" --generate-notes --draft
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  publish-npm:
    name: Publish npm
    if: inputs.npm && !inputs.dry_run
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/texthue/v/${{ needs.build.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: artifacts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Require an npm CLI that supports trusted publishing (11.5.1+)
        run: |
          version=$(npm --version)
          echo "npm $version"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm 11.5.1+ is required'); process.exit(1) }" "$version"
      - name: Check the npm registry's current state for this version
        id: state
        env:
          VERSION: ${{ needs.build.outputs.version }}
        # Exits nonzero (failing this job) for "conflicting" or
        # "lookup-failed" — never silently republished over, and never
        # skipped just because the registry could not be reached.
        run: |
          set -euo pipefail
          STATE=$(python3 tools/release.py npm-state --package texthue --version "$VERSION" --tarball "artifacts/texthue-${VERSION}.tgz")
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
      - name: Configure npm authentication
        if: steps.state.outputs.state == 'absent'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            echo "Authenticating with the NPM_TOKEN secret."
          else
            echo "No NPM_TOKEN secret; relying on npm trusted publishing (OIDC)."
          fi
      - name: Publish the tested tarball
        if: steps.state.outputs.state == 'absent'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: npm publish "artifacts/texthue-${VERSION}.tgz" --provenance --access public
      - name: Already published with these exact bytes
        if: steps.state.outputs.state == 'matching'
        run: echo "npm already has texthue@${{ needs.build.outputs.version }} with matching bytes; skipping."

  publish-adapters:
    name: Publish @texthue/${{ matrix.adapter }}
    if: inputs.npm_adapters && !inputs.dry_run && !failure() && !cancelled()
    needs: [build, publish-npm]
    strategy:
      fail-fast: false
      matrix:
        adapter: [react, tailwind]
    env:
      ADAPTER: ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@texthue/${{ matrix.adapter }}/v/${{ needs.build.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps: &scoped_npm_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: artifacts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Require an npm CLI that supports trusted publishing (11.5.1+)
        run: |
          version=$(npm --version)
          echo "npm $version"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm 11.5.1+ is required'); process.exit(1) }" "$version"
      - name: Check the npm registry's current state for this version
        id: state
        env:
          VERSION: ${{ needs.build.outputs.version }}
        # Exits nonzero (failing this job) for "conflicting" or
        # "lookup-failed" — never silently republished over, and never
        # skipped just because the registry could not be reached.
        run: |
          set -euo pipefail
          if [[ "$ADAPTER" != wasm ]]; then
            CORE=$(python3 tools/release.py npm-state --package texthue --version "$VERSION" --tarball "artifacts/texthue-${VERSION}.tgz")
            if [[ "$CORE" != matching ]]; then
              echo "::error::The exact core dependency must already be published"
              exit 1
            fi
          fi
          STATE=$(python3 tools/release.py npm-state --package "@texthue/$ADAPTER" --version "$VERSION" --tarball "artifacts/texthue-${ADAPTER}-${VERSION}.tgz")
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
      - name: Configure npm authentication
        if: steps.state.outputs.state == 'absent'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            echo "Authenticating with the NPM_TOKEN secret."
          else
            echo "No NPM_TOKEN secret; relying on npm trusted publishing (OIDC)."
          fi
      - name: Publish the tested tarball
        if: steps.state.outputs.state == 'absent'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: npm publish "artifacts/texthue-${ADAPTER}-${VERSION}.tgz" --provenance --access public
      - name: Already published with these exact bytes
        if: steps.state.outputs.state == 'matching'
        run: echo "npm already has @texthue/$ADAPTER@${{ needs.build.outputs.version }} with matching bytes; skipping."

  publish-maven:
    name: Publish Kotlin to Maven Central
    if: inputs.maven != '' && !inputs.dry_run
    needs: build
    environment: maven-central
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      DEPLOYMENT: ${{ inputs.maven }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: artifacts
      - name: Compare original artifacts with Central
        id: state
        run: |
          set -euo pipefail
          state=$(python3 tools/release.py maven-state --version "$VERSION" --archive "artifacts/texthue-${VERSION}-maven.zip")
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Sign and upload first deployment
        if: steps.state.outputs.state == 'absent' && inputs.maven == 'new'
        env:
          SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          SIGNING_FINGERPRINT: ${{ vars.MAVEN_SIGNING_FINGERPRINT }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo "::error::Dispatch with the existing Central deployment ID to resume."
            exit 1
          fi
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          python3 tools/sign-maven.py "artifacts/texthue-${VERSION}-maven.zip" signed.zip "$VERSION" "$SIGNING_FINGERPRINT"
          id=$(curl --fail --silent --show-error --header "Authorization: Bearer $CENTRAL_TOKEN" \
            --form 'bundle=@signed.zip;type=application/octet-stream' \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=texthue-$VERSION-$GITHUB_SHA")
          id=$(python3 -c 'import sys,uuid; print(uuid.UUID(sys.argv[1]))' "$id")
          echo "Central deployment: $id" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "DEPLOYMENT=$id" >> "$GITHUB_ENV"
      - name: Wait for original deployment and verify published bytes
        if: steps.state.outputs.state == 'absent'
        env:
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/maven_deployment.py "$DEPLOYMENT" "$VERSION"
          state=$(python3 tools/release.py maven-state --version "$VERSION" --archive "artifacts/texthue-${VERSION}-maven.zip")
          test "$state" = matching

  publish-dart:
    name: Publish Dart package
    if: inputs.dart && !inputs.dry_run
    needs: build
    runs-on: ubuntu-latest
    environment: pub-dev
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: artifacts
      - name: Compare the staged archive with pub.dev
        id: state
        run: |
          set -euo pipefail
          STATE=$(python3 tools/release.py dart-state --version "$VERSION" --archive "artifacts/texthue-${VERSION}-dart.tar.gz")
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        if: steps.state.outputs.state == 'absent'
        with:
          sdk: '3.12.2'
      - name: Publish the verified archive
        if: steps.state.outputs.state == 'absent'
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PUB_TOKEN"
          dart pub token add https://pub.dev --env-var PUB_TOKEN
          dart pub publish --force --from-archive="artifacts/texthue-${VERSION}-dart.tar.gz"
      - name: Already published with matching content
        if: steps.state.outputs.state == 'matching'
        run: echo "The staged Dart archive is already published."

  publish-nuget:
    name: Publish NuGet package
    if: inputs.nuget && !inputs.dry_run
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: artifacts
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '9.0.x'
      - name: Compare NuGet package content hashes
        id: state
        run: |
          set -euo pipefail
          dotnet build tools/NuGetState --configuration Release
          STATE=$(dotnet tools/NuGetState/bin/Release/net9.0/NuGetState.dll "$VERSION" "artifacts/TextHue.${VERSION}.nupkg")
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
      - name: Push the tested archive
        if: steps.state.outputs.state == 'absent'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/TextHue.${VERSION}.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
      - name: Already published with matching content
        if: steps.state.outputs.state == 'matching'
        run: echo "The staged package is already published."

  publish-rust:
    name: Publish Rust crate
    if: inputs.rust && !inputs.dry_run
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: crates-io
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: artifacts
      - name: Compare staged crate with registry
        id: state
        run: |
          set -euo pipefail
          STATE=$(python3 tools/release.py crate-state --version "$VERSION" --archive "artifacts/texthue-${VERSION}.crate")
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
      - name: Upload staged crate
        if: steps.state.outputs.state == 'absent'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 tools/publish-crate.py "$VERSION" "artifacts/texthue-${VERSION}.crate" --upload
      - name: Already published with matching checksum
        if: steps.state.outputs.state == 'matching'
        run: echo "The staged crate is already published."

  publish-wasm:
    name: Publish @texthue/wasm
    if: inputs.wasm && !inputs.dry_run
    needs: build
    runs-on: ubuntu-latest
    env:
      ADAPTER: wasm
    environment:
      name: npm
      url: https://www.npmjs.com/package/@texthue/wasm/v/${{ needs.build.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps: *scoped_npm_steps

  publish-pypi:
    name: Publish PyPI
    if: inputs.pypi && !inputs.dry_run
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/texthue/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: artifacts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check PyPI's current state for this version
        id: state
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          STATE=$(python tools/release.py pypi-state --package texthue --version "$VERSION" --dist artifacts)
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
      - name: Select the wheel and source distribution
        if: steps.state.outputs.state == 'absent'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir dist
          cp "artifacts/texthue-${VERSION}-py3-none-any.whl" "artifacts/texthue-${VERSION}.tar.gz" dist/
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.state.outputs.state == 'absent'
        with:
          print-hash: true
      - name: Already published with these exact bytes
        if: steps.state.outputs.state == 'matching'
        run: echo "PyPI already has texthue==${{ needs.build.outputs.version }} with matching bytes; skipping."

  publish-go:
    name: Tag Go module
    if: inputs.go && !inputs.dry_run
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23'
          cache: false
      - name: Check the module proxy's current state for this version's tag
        id: state
        env:
          VERSION: ${{ needs.build.outputs.version }}
        # A tag at a different commit than this release's is a hard
        # conflict: the workflow must never move or replace an existing tag.
        run: |
          set -euo pipefail
          STATE=$(python3 tools/release.py go-state --module-path "$MODULE" --version "$VERSION" --commit "$GITHUB_SHA")
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
      - name: Create and push the module tag
        if: steps.state.outputs.state == 'absent'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "packages/go/v${VERSION}" -m "TextHue Go v${VERSION}" "$GITHUB_SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/packages/go/v${VERSION}"
      - name: Ask the Go module proxy to index the release
        if: steps.state.outputs.state == 'absent'
        continue-on-error: true
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GOPROXY: https://proxy.golang.org
          GOSUMDB: off
        run: |
          cd "$(mktemp -d)"
          go mod init example.com/probe >/dev/null 2>&1
          for attempt in 1 2 3 4 5; do
            if go list -m "${MODULE}@v${VERSION}"; then exit 0; fi
            echo "Proxy has not indexed the tag yet (attempt ${attempt}); retrying."
            sleep 30
          done
          echo "::warning::proxy.golang.org did not confirm the release; it will index on first download."
      - name: Already published at this commit
        if: steps.state.outputs.state == 'matching'
        run: echo "packages/go/v${{ needs.build.outputs.version }} already tags this commit; skipping."

  verify-swift-release:
    name: Verify the SwiftPM version before publishing its root tag
    if: inputs.github_release
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test --force-resolved-versions
      - run: python3 tools/check-swift-tag.py

  github-release:
    name: Promote the draft GitHub release
    if: inputs.github_release && !inputs.dry_run && !failure() && !cancelled()
    needs: [build, publish-npm, publish-adapters, publish-dart, publish-maven, publish-nuget, publish-rust, publish-wasm, publish-pypi, publish-go, verify-swift-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck the root release tag before promotion
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 tools/release.py root-tag-state --version "$VERSION" --commit "$GITHUB_SHA"
      - name: Publish the draft release created by the build job
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        # The draft (with its archives, SHA256SUMS, and release-manifest.json
        # already attached by the build job) is promoted in place rather
        # than recreated, so the released assets are exactly the ones every
        # publish-* job checked its target's state against.
        run: gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --draft=false
