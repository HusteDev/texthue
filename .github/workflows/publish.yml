name: Publish

# Publishes a release of all three libraries from the selected branch commit.
# Start it manually from the Actions tab. Every target is opt-in and the build
# job verifies the tree and the version before any upload happens.
#
# One-time setup:
#   * npm:  either an NPM_TOKEN repository secret (granular automation token
#           with publish rights) or npm trusted publishing configured for
#           this repository and the `npm` environment.
#   * PyPI: a trusted publisher on pypi.org pointing at this repository,
#           workflow `publish.yml`, and the `pypi` environment. No secret.
#   * Go:   nothing; the module is published by pushing its tag.
# Optionally require reviewers on the `npm` and `pypi` environments.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v. Must match every package manifest.
        required: true
        type: string
      npm:
        description: Publish the npm package
        type: boolean
        default: true
      pypi:
        description: Publish the Python distribution to PyPI
        type: boolean
        default: true
      go:
        description: Tag the Go module release
        type: boolean
        default: true
      github_release:
        description: Create a GitHub release with the built archives
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  MODULE: github.com/HusteDev/texthue/packages/go

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23'
          cache: false
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: Check that every manifest declares the requested version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: echo "version=$(python tools/check-version.py "$REQUESTED")" >> "$GITHUB_OUTPUT"
      - name: Refuse to publish over an existing tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for tag in "v$VERSION" "packages/go/v$VERSION"; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag already exists. Bump the version before publishing."
              exit 1
            fi
          done
      - run: python tools/verify.py
      - run: python tools/build-packages.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  publish-npm:
    name: Publish npm
    if: inputs.npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/texthue/v/${{ needs.build.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: artifacts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Require an npm CLI that supports trusted publishing (11.5.1+)
        run: |
          npm --version
          node -e "const [a,b,c]=process.versions.npm.split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm 11.5.1+ is required'); process.exit(1) }"
      - name: Configure npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            echo "Authenticating with the NPM_TOKEN secret."
          else
            echo "No NPM_TOKEN secret; relying on npm trusted publishing (OIDC)."
          fi
      - name: Publish the tested tarball
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: npm publish "artifacts/texthue-${VERSION}.tgz" --provenance --access public

  publish-pypi:
    name: Publish PyPI
    if: inputs.pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/texthue/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: artifacts
      - name: Select the wheel and source distribution
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir dist
          cp "artifacts/texthue-${VERSION}-py3-none-any.whl" "artifacts/texthue-${VERSION}.tar.gz" dist/
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true

  publish-go:
    name: Tag Go module
    if: inputs.go
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23'
          cache: false
      - name: Create and push the module tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "packages/go/v${VERSION}" -m "TextHue Go v${VERSION}" "$GITHUB_SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/packages/go/v${VERSION}"
      - name: Ask the Go module proxy to index the release
        continue-on-error: true
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GOPROXY: https://proxy.golang.org
          GOSUMDB: off
        run: |
          cd "$(mktemp -d)"
          go mod init example.com/probe >/dev/null 2>&1
          for attempt in 1 2 3 4 5; do
            if go list -m "${MODULE}@v${VERSION}"; then exit 0; fi
            echo "Proxy has not indexed the tag yet (attempt ${attempt}); retrying."
            sleep 30
          done
          echo "::warning::proxy.golang.org did not confirm the release; it will index on first download."

  github-release:
    name: GitHub release
    if: inputs.github_release && !failure() && !cancelled()
    needs: [build, publish-npm, publish-pypi, publish-go]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: artifacts
      - name: Create the release with the built archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v${VERSION}" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "TextHue ${VERSION}" \
            --generate-notes
