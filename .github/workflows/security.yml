name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new CodeQL queries and Scorecard checks run against an unchanged tree.
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install --locked --version 0.22.2 cargo-audit
      - run: cargo audit --file packages/rust/Cargo.lock

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, go, actions, csharp, java-kotlin, swift]
        include:
          - os: ubuntu-latest
            mode: none
          - language: go
            mode: manual
          - language: java-kotlin
            mode: manual
          - language: swift
            os: macos-latest
            mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.mode }}
          queries: security-extended
      - name: Compile Go module under CodeQL
        if: matrix.language == 'go'
        working-directory: packages/go
        run: go build -a ./...
      - name: Compile Kotlin JVM sources under CodeQL
        if: matrix.language == 'java-kotlin'
        run: JAVA_HOME="$JAVA_HOME_17_X64" packages/kotlin/gradlew -p packages/kotlin --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process compileKotlin
      - name: Compile Swift package under CodeQL
        if: matrix.language == 'swift'
        run: swift build --package-path packages/swift --force-resolved-versions
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  workflows:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          min-severity: low

  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: scorecard.sarif
