name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  kotlin:
    name: Kotlin JVM conformance and Maven packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          python tools/verify.py --port kotlin
          packages/kotlin/gradlew -p packages/kotlin publishLibraryPublicationToStagingRepository
          python tools/check-maven.py
      - name: Measure kotlin performance
        shell: bash
        working-directory: .
        run: |
          mkdir -p benchmark-results
          JAVA_HOME="$JAVA_HOME_17_X64" packages/kotlin/gradlew -q -p packages/kotlin benchmark > benchmark-results/kotlin.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-kotlin-${{ runner.os }}-${{ runner.arch }}
          path: benchmark-results/
          if-no-files-found: error

  rust:
    name: Rust conformance and packaging
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python ../../tools/verify.py --port rust
      - name: Compare Rust placements and both theme fills with JavaScript
        working-directory: .
        shell: bash
        run: |
          npm ci
          npm run build
          node tools/measure-separation.mjs --cases > "$RUNNER_TEMP/separation.json"
          TEXTHUE_SEPARATION_CORPUS="$RUNNER_TEMP/separation.json" cargo test --locked --manifest-path packages/rust/Cargo.toml shared_assignment_vectors
      - name: Measure rust performance
        shell: bash
        working-directory: .
        run: |
          mkdir -p benchmark-results
          cargo bench --locked --manifest-path packages/rust/Cargo.toml --bench renderer > benchmark-results/rust.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-rust-${{ runner.os }}-${{ runner.arch }}
          path: benchmark-results/
          if-no-files-found: error
      - name: Stage and verify the Rust crate and packaged consumer
        run: python ../../tools/stage-rust.py ../../artifacts/rust

      - name: Verify WebAssembly bindings and package contents
        working-directory: .
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install --locked --version 0.2.130 wasm-bindgen-cli
          python tools/verify.py --port wasm
          archive=$(npm pack --silent ./packages/wasm | tail -1)
          npm ci
          python3 tools/check-wasm-consumer.py "$archive"
          python3 tools/check-browser.py google-chrome --wasm-package "$archive"
          python3 -m pip install playwright==1.59.0
          python3 -m playwright install --with-deps firefox webkit
          python3 tools/check-browser.py firefox --wasm-package "$archive"
          python3 tools/check-browser.py webkit --wasm-package "$archive"

  csharp:
    name: C# conformance and NuGet packaging (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '9.0.x'
      - run: python tools/verify.py --port csharp
      - name: Compare C# collection assignments with JavaScript
        shell: bash
        run: |
          npm ci
          npm run build
          node tools/measure-separation.mjs --cases > "$RUNNER_TEMP/separation.json"
          dotnet run -c Release --project packages/csharp/tests/Conformance -- "$RUNNER_TEMP/separation.json"
      - name: Measure dotnet performance
        shell: bash
        working-directory: .
        run: |
          mkdir -p benchmark-results
          dotnet run -c Release --project packages/csharp/benchmarks/Renderer > benchmark-results/dotnet.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-dotnet-${{ runner.os }}-${{ runner.arch }}
          path: benchmark-results/
          if-no-files-found: error
      - run: dotnet pack packages/csharp/src/TextHue --configuration Release --no-build --output artifacts/nuget
      - run: python tools/check-nuget.py artifacts/nuget
      - name: Check signed NuGet package recovery
        shell: pwsh
        run: ./tools/check-nuget-signing.ps1 artifacts/nuget

  dart:
    name: Dart conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: '3.8.1'
      - run: dart pub get --enforce-lockfile
      - run: python ../../tools/verify.py --port dart
      - name: Compare both theme fills and placements with JavaScript
        working-directory: .
        run: |
          npm ci
          npm run build
          node tools/measure-separation.mjs --cases > "$RUNNER_TEMP/separation.json"
          dart run packages/dart/tool/check_assignment.dart "$RUNNER_TEMP/separation.json"
      - run: python ../../tools/check-dart-publication.py
      - name: Measure dart performance
        shell: bash
        working-directory: .
        run: |
          mkdir -p benchmark-results
          (cd packages/dart && dart run tool/benchmark.dart) > benchmark-results/dart.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-dart-${{ runner.os }}-${{ runner.arch }}
          path: benchmark-results/
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: Ruff, Black, Biome, tsc, gofmt, go vet, golangci-lint, zizmor, shared files
        run: pre-commit run --all-files --show-diff-on-failure

  verify:
    name: Verify (${{ matrix.os }}, node ${{ matrix.node }}, python ${{ matrix.python }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22'
            python: '3.11'
            go: '1.23'
          - os: windows-latest
            node: '22'
            python: '3.11'
            go: '1.23'
          - os: macos-latest
            node: '22'
            python: '3.11'
            go: '1.23'
          - os: ubuntu-latest
            node: '24'
            python: '3.13'
            go: '1.25'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '9.0.x'
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: '3.8.1'
      - run: dart pub get --enforce-lockfile
        working-directory: packages/dart
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check-version.py
      - name: Run Swift conformance on the host runtime
        if: matrix.os == 'macos-latest' || (matrix.os == 'ubuntu-24.04' && matrix.node == '22')
        working-directory: packages/swift
        run: |
          swift --version
          (cd ../.. && npm run build && node tools/measure-separation.mjs --cases > "$RUNNER_TEMP/separation.json")
          export TEXTHUE_SEPARATION_CORPUS="$RUNNER_TEMP/separation.json"
          swift test --package-path ../.. --force-resolved-versions
          python3 ../../tools/verify.py --port swift
          python3 ../../tools/check-swift-tag.py
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify with JDK 17
        run: python tools/verify.py
      - name: Measure primary performance
        if: matrix.os == 'ubuntu-24.04' && matrix.node == '22'
        shell: bash
        working-directory: .
        run: |
          mkdir -p benchmark-results
          node tools/bench.mjs > benchmark-results/javascript.txt
          python tools/bench.py > benchmark-results/python.txt
          go -C packages/go test -run '^$' -bench '^BenchmarkResolverContrast$' -benchtime=100x > benchmark-results/go-resolve.txt
          go -C packages/go test -run '^$' -bench '^BenchmarkAssign40$' -benchtime=20x > benchmark-results/go-assign.txt
          swift run --package-path packages/swift --force-resolved-versions -c release TextHueBenchmark > benchmark-results/swift.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-24.04' && matrix.node == '22'
        with:
          name: benchmarks-primary-${{ runner.os }}-${{ runner.arch }}
          path: benchmark-results/
          if-no-files-found: error
      - name: Compile CSS with the packed Tailwind adapter
        if: matrix.os == 'ubuntu-24.04' && matrix.node == '22'
        run: python tools/check-tailwind-consumer.py
      - name: Exercise staged inspector in Firefox and WebKit
        if: matrix.os == 'ubuntu-24.04' && matrix.node == '22'
        run: |
          python -m pip install playwright==1.59.0
          python -m playwright install --with-deps firefox webkit
          python tools/check-inspector.py firefox
          python tools/check-inspector.py webkit
          python tools/check-browser.py firefox --css-only
          python tools/check-browser.py webkit --css-only
      - name: Exercise the packed React adapter on React 18 and 19
        if: matrix.os == 'ubuntu-24.04' && matrix.node == '22'
        run: python tools/check-react-consumers.py
      - name: Verify CSS fallback and rendered pixels in Chrome
        if: matrix.os == 'ubuntu-24.04' && matrix.node == '22'
        run: python tools/check-browser.py google-chrome
      - run: python tools/build-packages.py
      - name: Select the minimum supported consumer runtime
        if: matrix.os == 'ubuntu-24.04' && matrix.node == '22'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.0.0'
      - name: Verify the compiled library on Node 20.0.0
        if: matrix.os == 'ubuntu-24.04' && matrix.node == '22'
        run: node --test tests/text-to-color.test.mjs tests/resolver.test.mjs tests/sha256.test.mjs

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: JavaScript coverage
        run: npm run coverage
      - name: Python coverage
        run: JAVA_HOME="${JAVA_HOME_17_X64:?JDK 17 is required}" npm run coverage:python
      - name: Go coverage
        run: npm run coverage:go
      - name: Upload JavaScript coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/js.lcov
          flags: javascript
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
      - name: Upload Python coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/python.xml
          flags: python
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
      - name: Upload Go coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/go.out
          flags: go
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
