name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  kotlin:
    name: Kotlin JVM conformance and Maven packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          python tools/verify.py --port kotlin
          packages/kotlin/gradlew -p packages/kotlin publishLibraryPublicationToStagingRepository
          python tools/check-maven.py

  rust:
    name: Rust conformance and packaging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python ../../tools/verify.py --port rust
      - name: Stage and verify the Rust crate and packaged consumer
        run: python ../../tools/stage-rust.py ../../artifacts/rust

      - name: Verify WebAssembly bindings and package contents
        working-directory: .
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install --locked --version 0.2.130 wasm-bindgen-cli
          python tools/verify.py --port wasm
          archive=$(npm pack --silent ./packages/wasm | tail -1)
          python3 tools/check-browser.py google-chrome --wasm-package "$archive"

  csharp:
    name: C# conformance and NuGet packaging (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '9.0.x'
      - run: python tools/verify.py --port csharp
      - run: dotnet pack packages/csharp/src/TextHue --configuration Release --no-build --output artifacts/nuget
      - run: python tools/check-nuget.py artifacts/nuget

  dart:
    name: Dart conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: '3.8.1'
      - run: dart pub get --enforce-lockfile
      - run: python ../../tools/verify.py --port dart
      - run: python ../../tools/check-dart-publication.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: Ruff, Black, Biome, tsc, gofmt, go vet, golangci-lint, zizmor, shared files
        run: pre-commit run --all-files --show-diff-on-failure

  verify:
    name: Verify (${{ matrix.os }}, node ${{ matrix.node }}, python ${{ matrix.python }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
            python: '3.11'
            go: '1.23'
          - os: windows-latest
            node: '22'
            python: '3.11'
            go: '1.23'
          - os: macos-latest
            node: '22'
            python: '3.11'
            go: '1.23'
          - os: ubuntu-latest
            node: '24'
            python: '3.13'
            go: '1.25'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check-version.py
      - name: Run Swift conformance on the host runtime
        if: matrix.os == 'macos-latest' || (matrix.os == 'ubuntu-latest' && matrix.node == '22')
        working-directory: packages/swift
        run: |
          swift --version
          swift test --package-path ../.. --force-resolved-versions
          python3 ../../tools/verify.py --port swift
      - run: python tools/verify.py
      - name: Verify CSS fallback and rendered pixels in Chrome
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: python tools/check-browser.py google-chrome
      - run: python tools/build-packages.py

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: JavaScript coverage
        run: npm run coverage
      - name: Python coverage
        run: npm run coverage:python
      - name: Go coverage
        run: npm run coverage:go
      - name: Upload JavaScript coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/js.lcov
          flags: javascript
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
      - name: Upload Python coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/python.xml
          flags: python
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
      - name: Upload Go coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/go.out
          flags: go
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
